schema_version: ONLINE_TRADER_MODULE_BOUNDARIES/1
verified_at_sha: WORKTREE
verified_on: "2026-11-23"
note: Static navigation aid only. Dynamic Qt, IPC and SDK relationships still require source review.

current_workbench_contract: docs/refactor/runtime-workbench-current-20261120.md

boundaries:
  - id: standalone-desktop-client
    route: STANDALONE
    entries:
      - src/online_trader/desktop/entrypoint.py
      - src/online_trader/desktop/runtime_bootstrap.py
      - src/online_trader/desktop/workbench.py:WorkbenchWindow
    collaborators:
      - src/online_trader/desktop/runtime_client/client.py:RuntimeClientCoordinator
      - src/online_trader/desktop/runtime_client/client.py:CommandBus
      - src/online_trader/desktop/runtime_client/state.py:ClientStateStore
    owns:
      - Qt presentation and drafts
      - process-local pending command correlation
      - bounded client I/O workers
    must_not_own:
      - SDK order sending
      - broker position or fill truth
      - execution-ledger writes
      - cross-boot command responsibility

  - id: standalone-runtime-bootstrap
    route: STANDALONE_BOOTSTRAP
    entries:
      - src/online_trader/runtime/standalone.py:run_session
      - src/online_trader/runtime/launch.py:run_cli
      - src/online_trader/runtime/desktop_bootstrap.py:run_confirmed_start
      - src/online_trader/runtime/view_process.py:ViewProcess
    collaborators:
      - src/online_trader/runtime/session_storage.py:RuntimeSessionStorage
      - src/online_trader/runtime/target_owner_startup.py:run_target_owner
      - src/online_trader/runtime/instance.py:RuntimeLock
    owns:
      - one Runtime boot and process-owned temporary Journal allocation
      - version-fixed selection of the single current Standalone owner
      - launch validation and shutdown/lifecycle coordination
    must_not_own:
      - SDK order sending or target-execution state beside the Target Owner
      - cross-device locks for the same futures account
      - durable handoff of a prior boot execution ledger

  - id: standalone-history-cache
    route: STANDALONE
    entries:
      - src/online_trader/runtime/portable_config.py:PortableAccountStore.history_path
      - src/online_trader/runtime/account_history.py
      - src/online_trader/runtime/account_cache.py
    owns:
      - broker-rebuildable history and return cache
    must_not_own:
      - order sending
      - position authority
      - execution responsibility

  - id: dsv-replacement
    route: REPLACEMENT
    entries:
      - src/online_trader/dsv_runtime/runner.py:DsvSession
      - src/online_trader/dsv_runtime/runner.py:DsvSession.apply_round
    collaborators:
      - src/online_trader/dsv_runtime/controller.py:ExplicitOrderController
      - src/online_trader/dsv_runtime/target_execution.py:account_target
      - src/online_trader/dsv_runtime/sdk_adapter.py:DsvSdkAdapter
      - src/online_trader/dsv_storage/journal.py:Journal
      - src/online_trader/dsv_core
    owns:
      - replacement ordered facts and strategy state
      - Runtime-proved target and non-terminal potential-quantity accounting
      - per-child pre-send durability and UNKNOWN responsibility
      - explicitly bound SDK adapter behavior
    must_not_depend_on:
      - legacy Kernel owner as a second sender
      - Qt or Workbench state
      - QA fixture injection in online SDK mode

  - id: standalone-target-owner
    route: STANDALONE_DEFAULT_OWNER
    entries:
      - src/online_trader/runtime/desktop_bootstrap.py:_STANDALONE_EXECUTION_CORE
      - src/online_trader/runtime/target_owner_startup.py:run_target_owner
      - src/online_trader/dsv_runtime/standalone_owner.py:create_standalone_owner
    collaborators:
      - src/online_trader/dsv_runtime/owner_binding.py:StandaloneOwnerBinding
      - src/online_trader/dsv_runtime/standalone_commands.py:translate_workbench_command
      - src/online_trader/dsv_runtime/standalone_projection.py:workbench_view
      - src/online_trader/kernel/server.py:ControlServer
      - src/online_trader/runtime/account_publication.py:AccountPublication
      - src/online_trader/runtime/account_cache.py:BrokerHistoryWriter
    owns:
      - one target-execution owner and SDK sender in the current Runtime boot
      - existing Runtime IPC and Workbench projection adaptation
      - safe flatten-then-stop completion evidence
    must_not_be_used_as:
      - a user-selectable second execution core
      - a simultaneous sender beside Legacy Kernel

  - id: legacy-runtime
    route: LEGACY_EXPLICIT_MAINTENANCE
    entries:
      - src/online_trader/kernel
      - src/online_trader/gateway/tqkq_dsv.py
      - src/online_trader/ledger/store.py
    owns:
      - legacy execution and recovery contract while that route remains supported
    must_not_be_used_as:
      - default desktop or package route
      - implicit source of Replacement entry gates

  - id: isolated-dsv-qa
    route: ISOLATED_QA
    entries:
      - qa/dsv_parity
      - qa/runtime_replay.py
      - qa/target_owner/offline_runtime.py
      - qa/target_owner/process_runtime.py
      - qa/target_owner/fake_broker.py
      - qa/test_manifest.json
      - qa/test_registry.py
      - qa/test_runner.py
      - src/online_trader/dsv_runtime/offline_endpoint.py
    owns:
      - frozen fixtures and bounded offline replay
      - QA-only Standalone Target Owner process and private fact channel
      - parent-side Fake Broker state, explicit native facts, and virtual-time frames
    must_not_be_used_as:
      - production online input port
      - proof of live broker behavior
