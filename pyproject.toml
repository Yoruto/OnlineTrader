[build-system]
requires = ["setuptools==84.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "online-trader"
version = "0.1.0.dev28"
description = "Independent Windows trading kernel engineering baseline"
requires-python = ">=3.13,<3.14"
dependencies = ["jsonschema==4.26.0", "referencing==0.37.0"]

[project.optional-dependencies]
desktop = ["PySide6==6.8.2.1"]
simulation = ["tqsdk==3.10.4"]

[project.scripts]
online-trader = "online_trader.cli:main"

[project.gui-scripts]
online-trader-desktop = "online_trader.desktop.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["online_trader*"]

[tool.setuptools.package-data]
online_trader = ["resources/*.sql", "resources/*.json"]
